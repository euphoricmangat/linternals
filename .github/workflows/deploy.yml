name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploy using Astro + Actions (not the default Jekyll branch builder).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install
        run: npm install

      - name: Normalize base path
        id: base
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          if [ -z "$BASE" ] || [ "$BASE" = "/" ]; then
            BASE="/"
          else
            BASE="/${BASE#/}"
            BASE="${BASE%/}/"
          fi
          echo "path=$BASE" >> "$GITHUB_OUTPUT"
          echo "Using base: $BASE"

      - name: Build
        run: npx astro build --site "${{ steps.pages.outputs.origin }}" --base "${{ steps.base.outputs.path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
